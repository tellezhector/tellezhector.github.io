<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fillers</title>
  <script data-goatcounter="https://tellezhector.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
  <style>
    #container {
      display: none;
      max-width: 600px;
      margin: 0 auto;
    }

    #container.visible {
      display: block;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    #legend {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .legend-item {
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2px 12px;
      font-size: 1rem;
      border-radius: 4px;
    }

    .legend-item.visible {
      display: flex;
    }

    body {
      font-family: monospace;
      padding: 0.5rem;
      background: #111;
      color: #eee;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 5 / 2;
      font-size: 0.85rem;
      border-radius: 4px;
    }

    :root {
      --canon-bg: #4CAF50;     --canon-fg: #FFF;
      --mixed-bg: #FFEB3B;     --mixed-fg: #000;
      --filler-bg: #F44336;    --filler-fg: #FFF;
      --anime-canon-bg: #FF9800; --anime-canon-fg: #FFF;
      --unknown-bg: #555;      --unknown-fg: #AAA;
      --conflict-bg: #9C27B0;  --conflict-fg: #AAA;
    }

    :root.colorblind {
      --canon-bg: #0072B2;     --canon-fg: #FFF;
      --mixed-bg: #F0E442;     --mixed-fg: #000;
      --filler-bg: #D55E00;    --filler-fg: #FFF;
      --anime-canon-bg: #E69F00; --anime-canon-fg: #000;
      --unknown-bg: #555;      --unknown-fg: #AAA;
      --conflict-bg: #CC79A7;  --conflict-fg: #000;
    }

    .canon      { background-color: var(--canon-bg);      color: var(--canon-fg); }
    .mixed      { background-color: var(--mixed-bg);      color: var(--mixed-fg); }
    .filler     { background-color: var(--filler-bg);     color: var(--filler-fg); }
    .anime_canon { background-color: var(--anime-canon-bg); color: var(--anime-canon-fg); }
    .unknown    { background-color: var(--unknown-bg);    color: var(--unknown-fg); }
    .conflict   { background-color: var(--conflict-bg);   color: var(--conflict-fg); }

    #download-btn {
      display: block;
      margin: 1rem auto 0;
      padding: 8px 20px;
      font-family: monospace;
      font-size: 1rem;
      cursor: pointer;
      background: #333;
      color: #eee;
      border: 1px solid #555;
      border-radius: 4px;
    }

    #download-btn:hover {
      background: #444;
    }

    #colorblind-btn {
      display: block;
      margin: 0.5rem auto 0.5rem;
      padding: 8px 20px;
      font-family: monospace;
      font-size: 1rem;
      cursor: pointer;
      background: #333;
      color: #eee;
      border: 1px solid #555;
      border-radius: 4px;
    }

    #colorblind-btn:hover { background: #444; }
    #colorblind-btn.active { background: #1a3a5c; border-color: #0072B2; }

    nav a, nav a:visited {
      color: #eee;
    }

    @media (max-width: 500px) {
      .cell {
        aspect-ratio: 5 / 4;
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>
<nav>
  <a href="#bleach">Bleach</a> |
  <a href="#bleach-thousand-year-blood-war">Bleach: Thousand-Year Blood War</a> |
  <a href="#cowboy-bebop">Cowboy Bebop</a> |
  <a href="#dragon-ball">Dragon Ball</a> |
  <a href="#dragon-ball-super">Dragon Ball Super</a> |
  <a href="#dragon-ball-z">Dragon Ball Z</a> |
  <a href="#my-hero-academia">My Hero Academia</a> |
  <a href="#naruto">Naruto</a> |
  <a href="#naruto-shippuden">Naruto Shippuden</a> |
  <a href="#neon-genesis-evangelion">Neon Genesis Evangelion</a> |
  <a href="#one-piece">One Piece</a>
</nav>


<div id="container">
  <h1 id="page-title"></h1>
  <button id="colorblind-btn" onclick="toggleColorblind()">colorblind-friendly: off</button>
  <div id="legend">
    <div id="canon" class="legend-item canon" data-label="canon"></div>
    <div id="mixed" class="legend-item mixed" data-label="mixed"></div>
    <div id="anime_canon" class="legend-item anime_canon" data-label="anime canon"></div>
    <div id="filler" class="legend-item filler" data-label="filler"></div>
    <div id="unknown" class="legend-item unknown" data-label="unknown"></div>
    <div id="conflict" class="legend-item conflict" data-label="conflict"></div>
  </div>
  <div id="grid"></div>
  <button id="download-btn" onclick="downloadPNG()">Download as PNG</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  function toggleColorblind() {
    const btn = document.getElementById('colorblind-btn');
    const on = document.documentElement.classList.toggle('colorblind');
    btn.textContent = `colorblind-friendly: ${on ? 'on' : 'off'}`;
    btn.classList.toggle('active', on);
  }

  function downloadPNG() {
    html2canvas(document.getElementById('container'), { backgroundColor: '#111' }).then(canvas => {
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      const pageTitle = document.getElementById('page-title').textContent.trim().toLocaleLowerCase().replace(/[^a-z0-9]+/g, '_');
      a.download = pageTitle ? `${pageTitle}_fillers.png` : 'fillers.png';
      a.click();
    });
  }

  function getClass(show, n) {
    const matches = [
      show.canon.includes(n),
      show.mixed.includes(n),
      show.fillers.includes(n),
      show.anime_canon.includes(n),
    ].filter(Boolean).length;

    if (matches > 1)                  return 'conflict';
    if (show.canon.includes(n))       return 'canon';
    if (show.mixed.includes(n))       return 'mixed';
    if (show.fillers.includes(n))     return 'filler';
    if (show.anime_canon.includes(n)) return 'anime_canon';
    return 'unknown';
  }

  function clearGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    document.querySelectorAll('.legend-item').forEach(el => el.classList.remove('visible'));
    document.getElementById('container').classList.remove('visible');
  }

  function renderGrid(show) {
    document.getElementById('container').classList.add('visible');
    document.title = `Fillers: ${show.title}`;
    document.getElementById('page-title').textContent = show.title;

    const max = Math.max(...show.canon, ...show.mixed, ...show.fillers, ...show.anime_canon);
    const counts = {};

    for (let i = 1; i <= max; i++) {
      const cls = getClass(show, i);
      const cell = document.createElement('div');
      cell.className = `cell ${cls}`;
      cell.textContent = i;
      grid.appendChild(cell);

      counts[cls] = (counts[cls] || 0) + 1;
      const legendItem = document.getElementById(cls);
      if (legendItem) legendItem.classList.add('visible');
    }

    for (const [cls, count] of Object.entries(counts)) {
      const legendItem = document.getElementById(cls);
      if (!legendItem) continue;
      const pct = (count / max) * 100;
      const pctStr = Number.isInteger(pct) ? `${pct}%` : `${pct.toFixed(1)}%`;
      legendItem.textContent = `${legendItem.dataset.label} ${pctStr}`;
    }
  }

  function loadShow(name) {
    clearGrid()
    fetch(`jsons/${name}.json`)
      .then(r => r.json())
      .then(show => renderGrid(show));
  }

  showName = window.location.hash.slice(1)
  loadShow(showName);

  window.addEventListener('hashchange', () => loadShow(window.location.hash.slice(1)));
</script>

</body>
</html>
