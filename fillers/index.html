<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fillers</title>
  <script data-goatcounter="https://tellezhector.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
  <style>
    #container {
      display: none;
      max-width: 600px;
      margin: 0 auto;
    }

    #container.visible {
      display: block;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    #legend {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .legend-item {
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2px 12px;
      font-size: 1rem;
      border-radius: 4px;
    }

    .legend-item.visible {
      display: flex;
    }

    body {
      font-family: monospace;
      padding: 0.5rem;
      background: #111;
      color: #eee;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 5 / 2;
      font-size: 0.85rem;
      border-radius: 4px;
    }

    .canon      { background-color: #4caf50; color: #fff; }
    .mixed      { background-color: #ffeb3b; color: #000; }
    .filler     { background-color: #f44336; color: #fff; }
    .anime_canon { background-color: #ff9800; color: #fff; }
    .unknown    { background-color: #555; color: #aaa; }
    .conflict   { background-color: #9c27b0; color: #aaa; }

    #download-btn {
      display: block;
      margin: 1rem auto 0;
      padding: 8px 20px;
      font-family: monospace;
      font-size: 1rem;
      cursor: pointer;
      background: #333;
      color: #eee;
      border: 1px solid #555;
      border-radius: 4px;
    }

    #download-btn:hover {
      background: #444;
    }

    nav a, nav a:visited {
      color: #eee;
    }

    @media (max-width: 500px) {
      .cell {
        font-size: 0.5rem;
      }
    }
  </style>
</head>
<body>
<nav>
  <a href="#one-piece">One Piece</a> |
  <a href="#naruto">Naruto</a> |
  <a href="#naruto-shippuden">Naruto Shippuden</a> |
  <a href="#bleach">Bleach</a> |
  <a href="#dragon-ball">Dragon Ball</a> |
  <a href="#dragon-ball-z">Dragon Ball Z</a> |
  <a href="#dragon-ball-super">Dragon Ball Super</a>
</nav>


<div id="container">
  <h1 id="page-title"></h1>
  <div id="legend">
    <div id="canon" class="legend-item canon">canon</div>
    <div id="mixed" class="legend-item mixed">mixed</div>
    <div id="anime_canon" class="legend-item anime_canon">anime canon</div>
    <div id="filler" class="legend-item filler">filler</div>
    <div id="unknown" class="legend-item unknown">unknown</div>
    <div id="conflict" class="legend-item conflict">conflict</div>
  </div>
  <div id="grid"></div>
  <button id="download-btn" onclick="downloadPNG()">Download as PNG</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  function downloadPNG() {
    html2canvas(document.getElementById('container'), { backgroundColor: '#111' }).then(canvas => {
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      const pageTitle = document.getElementById('page-title').textContent.trim().toLocaleLowerCase().replace(/[^a-z0-9]+/g, '_');
      a.download = pageTitle ? `${pageTitle}_fillers.png` : 'fillers.png';
      a.click();
    });
  }

  function getClass(show, n) {
    const matches = [
      show.canon.includes(n),
      show.mixed.includes(n),
      show.fillers.includes(n),
      show.anime_canon.includes(n),
    ].filter(Boolean).length;

    if (matches > 1)                  return 'conflict';
    if (show.canon.includes(n))       return 'canon';
    if (show.mixed.includes(n))       return 'mixed';
    if (show.fillers.includes(n))     return 'filler';
    if (show.anime_canon.includes(n)) return 'anime_canon';
    return 'unknown';
  }

  function clearGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    document.querySelectorAll('.legend-item').forEach(el => el.classList.remove('visible'));
    document.getElementById('container').classList.remove('visible');
  }

  function renderGrid(show) {
    document.getElementById('container').classList.add('visible');
    document.title = `Fillers: ${show.title}`;
    document.getElementById('page-title').textContent = show.title;

    const max = Math.max(...show.canon, ...show.mixed, ...show.fillers, ...show.anime_canon);
    const seen = new Set();

    for (let i = 1; i <= max; i++) {
      const cls = getClass(show, i);
      const cell = document.createElement('div');
      cell.className = `cell ${cls}`;
      cell.textContent = i;
      grid.appendChild(cell);

      if (!seen.has(cls)) {
        seen.add(cls);
        const legendItem = document.getElementById(cls);
        if (legendItem) legendItem.classList.add('visible');
      }
    }
  }

  function loadShow(name) {
    clearGrid()
    fetch(`jsons/${name}.json`)
      .then(r => r.json())
      .then(show => renderGrid(show));
  }

  showName = window.location.hash.slice(1)
  loadShow(showName);

  window.addEventListener('hashchange', () => loadShow(window.location.hash.slice(1)));
</script>

</body>
</html>
