<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fillers</title>
  <script data-goatcounter="https://tellezhector.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
  <style>
    #container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    #legend {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .legend-item {
      display: none;
      align-items: center;
      justify-content: center;
      padding: 4px 12px;
      font-size: 1.2rem;
      border-radius: 4px;
    }

    .legend-item.visible {
      display: flex;
    }

    body {
      font-family: monospace;
      padding: 1rem;
      background: #111;
      color: #eee;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 5 / 3;
      font-size: 0.85rem;
      border-radius: 4px;
    }

    .canon      { background-color: #4caf50; color: #fff; }
    .mixed      { background-color: #ffeb3b; color: #000; }
    .filler     { background-color: #f44336; color: #fff; }
    .anime_canon { background-color: #ff9800; color: #fff; }
    .unknown    { background-color: #555; color: #aaa; }

    #download-btn {
      display: block;
      margin: 1rem auto 0;
      padding: 8px 20px;
      font-family: monospace;
      font-size: 1rem;
      cursor: pointer;
      background: #333;
      color: #eee;
      border: 1px solid #555;
      border-radius: 4px;
    }

    #download-btn:hover {
      background: #444;
    }
  </style>
</head>
<body>

<div id="container">
  <h1 id="page-title"></h1>
  <div id="legend">
    <div id="canon" class="legend-item canon">canon</div>
    <div id="mixed" class="legend-item mixed">mixed</div>
    <div id="anime_canon" class="legend-item anime_canon">anime canon</div>
    <div id="filler" class="legend-item filler">filler</div>
    <div id="unknown" class="legend-item unknown">unknown</div>
  </div>
  <div id="grid"></div>
</div>

<button id="download-btn">Download as PNG</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  const title = "One Piece"
  const canon = [1, 6, 8, 14, 23, 25, 27, 29, 33, 34, 35, 36, 45, 50, 54, 61, 69, 71, 73, 86, 92, 101, 110, 111, 112, 121, 126, 130];
  const mixed=[2, 3, 7, 10, 19, 24, 30, 41, 42, 46, 49, 51, 52, 53, 57, 64, 65, 68, 70, 74, 77, 80, 85, 91, 93, 94, 100, 105, 114, 116, 117, 119, 120, 122, 128]
  const anime_canon = [12, 16, 17, 20, 21, 22, 31, 37, 48, 55, 60, 66, 72, 75, 78, 79, 82, 83, 84, 87, 88, 89, 96, 97, 103, 104, 108, 118, 124, 127, 131];
  const fillers = [4, 5, 9, 11, 13, 15, 18, 26, 28, 32, 38, 39, 40, 43, 44, 47, 56, 58, 59, 62, 63, 67, 76, 81, 90, 95, 98, 99, 102, 106, 107, 109, 113, 115, 123, 125, 129, 132];

  function getClass(n) {
    if (canon.includes(n))       return 'canon';
    if (mixed.includes(n))       return 'mixed';
    if (fillers.includes(n))     return 'filler';
    if (anime_canon.includes(n)) return 'anime_canon';
    return 'unknown';
  }

  document.title = `Fillers: ${title}`;
  document.getElementById('page-title').textContent = title;

  const max = Math.max(...canon, ...mixed, ...fillers, ...anime_canon);
  const grid = document.getElementById('grid');

  const seen = new Set();

  for (let i = 1; i <= max; i++) {
    const cls = getClass(i);
    const cell = document.createElement('div');
    cell.className = `cell ${cls}`;
    cell.textContent = i;
    grid.appendChild(cell);

    if (!seen.has(cls)) {
      seen.add(cls);
      const legendItem = document.getElementById(cls);
      if (legendItem) legendItem.classList.add('visible');
    }
  }

  document.getElementById('download-btn').addEventListener('click', () => {
    html2canvas(document.getElementById('container'), { backgroundColor: '#111' }).then(canvas => {
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = `${title.replace(/\s+/g, '_')}_fillers.png`;
      a.click();
    });
  });
</script>

</body>
</html>
