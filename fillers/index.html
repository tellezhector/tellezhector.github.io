    #container {

      margin: 0 auto;

    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    #legend {
      display: flex;
      gap: 8px;

    }

      padding: 1rem;
      background: #111;

    .cell {

      justify-content: center;
      aspect-ratio: 5 / 2;
      font-size: 0.85rem;

    .mixed      { background-color: #ffeb3b; color: #000; }
    .filler     { background-color: #f44336; color: #fff; }

    .unknown    { background-color: #555; color: #aaa; }
    .conflict   { background-color: #9c27b0; color: #aaa; }

    #download-btn {
      display: block;
      margin: 1rem auto 0;
      padding: 8px 20px;
      font-family: monospace;
      font-size: 1rem;
      cursor: pointer;
      background: #333;
      color: #eee;
      border: 1px solid #555;
      border-radius: 4px;
    }

    #download-btn:hover {

    }

  function getClass(show, n) {
    const matches = [
      show.canon.includes(n),
      show.mixed.includes(n),
      show.fillers.includes(n),
      show.anime_canon.includes(n),
    ].filter(Boolean).length;

    if (matches > 1)                  return 'conflict';
    if (show.canon.includes(n))       return 'canon';
    if (show.mixed.includes(n))       return 'mixed';
    if (show.fillers.includes(n))     return 'filler';
    if (show.anime_canon.includes(n)) return 'anime_canon';
    return 'unknown';

  function renderGrid(show) {
    document.title = `Fillers: ${show.title}`;
    document.getElementById('page-title').textContent = show.title;

    const max = Math.max(...show.canon, ...show.mixed, ...show.fillers, ...show.anime_canon);
    const grid = document.getElementById('grid');

    const seen = new Set();

    for (let i = 1; i <= max; i++) {
      const cls = getClass(show, i);
      const cell = document.createElement('div');
      cell.className = `cell ${cls}`;
      cell.textContent = i;
      grid.appendChild(cell);

      if (!seen.has(cls)) {
        seen.add(cls);
        const legendItem = document.getElementById(cls);

      }
    }
  }
